[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-checking-agent"
version = "1.0.0"
description = "Consistency Checking Agent: kiểm tra tính nhất quán giữa kiến trúc thiết kế và mã nguồn (Adaptive Multi-Agent, MAPE-K)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "networkx>=3.1"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=7.0"]

[project.scripts]
cca = "consistency_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["consistency_agent*"]

[tool.setuptools.package-data]
consistency_agent = ["rag/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
